# Phase 1 end-to-end script: every Camera Command (46 items) at least once, default [compat], simulated devices.
# docs/phase1-design.md §5.2 (expectations), §3.7.2 (format). Used by tests/integration/test_end_to_end.py.
#
# The server must use the 09 §5.6 reference alox.ini (zmin_DBL = 0, zmax_DBL = 20, Low Mag LimitMinExposure 177,
# lightStatusInverter TRUE) and [simulation] defaults (640 x 480 U8 frames, stage 0..25 mm). Variables to pass with
# --var: sim_dir (a folder of PNG files; the first one, in name order, is 320 x 240), ffc and dfc (640 x 480 U8 PNG
# flat-field / dark-field images, F != D). The script ends with Exit: the server stops.

[session]
host = "127.0.0.1"
port = 503
timeout_s = 10.0
no_reply_wait_s = 0.25
mask = ["tick"]

[vars]
cam_hm = "cam0"
cam_lm = "cam1"
first_png_width = "320"
first_png_height = "240"
stage_identity = "(c) aloxcam SimStage, C-663-SIM, 0000000001, 0.0.0"

# ------------------------------------------------------------------------------------------ 1-2 general commands
[[step]]
name = "heartbeat frame"
heartbeat_frame = true
expect = { reply = "none", connection = "open" }

[[step]]
command = "Get Heartbeat"
expect = { reply = "U32", error = { status = false, code = 0, source = "" } }

[[step]]
command = "Show UI"
data = { show = true }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Log"
data = { log = true, path = "${sim_dir}", max_lines = 1000, max_count = 10 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 3 High Mag before set-up
[[step]]
name = "HM status before set-up"
command = "Cam Get Acquisition Status"
data = { camera_type = "High Mag." }
expect = { reply = "BOOL", value = false, error = { status = false, code = 0 } }

[[step]]
name = "HM stop before set-up"
command = "Cam Stop"
data = { camera_type = "High Mag." }
expect = { reply = "ACK", error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 4-6 set-up, attributes, start
[[step]]
name = "setup HM"
command = "Cam Setup"
data = { camera_type = "High Mag.", camera_name = "${cam_hm}", number_of_buffers = 5, continuous_mode = true }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "setup LM"
command = "Cam Setup"
data = { camera_type = "Low Mag.", camera_name = "${cam_lm}", number_of_buffers = 5, continuous_mode = true }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Cam Set Exposure"
data = { camera_type = "High Mag.", exposure = 1500.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Cam Get Exposure"
data = { camera_type = "High Mag." }
expect = { reply = "DBL", value = 1500.0, error = { status = false, code = 0 } }

[[step]]
name = "LM exposure below the minimum"
command = "Cam Set Exposure"
data = { camera_type = "Low Mag.", exposure = 100.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "LM exposure clamped to 177"
command = "Cam Get Exposure"
data = { camera_type = "Low Mag." }
expect = { reply = "DBL", value = 177.0, error = { status = false, code = 0 } }

[[step]]
command = "Cam Set Gain"
data = { camera_type = "High Mag.", gain = 2.5 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "HM gain rounded half to even (I64)"
command = "Cam Get Gain"
data = { camera_type = "High Mag." }
expect = { reply = "DBL", value = 2.0, error = { status = false, code = 0 } }

[[step]]
command = "Cam Flip"
data = { camera_type = "Low Mag.", horizontal_flip = false, vertical_flip = true }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "start HM"
command = "Cam Start"
data = { camera_type = "High Mag.", triggered = false }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "start LM"
command = "Cam Start"
data = { camera_type = "Low Mag.", triggered = false }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "HM acquiring"
command = "Cam Get Acquisition Status"
data = { camera_type = "High Mag." }
expect = { reply = "BOOL", value = true, error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 7-9 images
[[step]]
name = "stream HM (camera)"
command = "Cam Stream Next Image"
data = { camera_type = "High Mag.", simulation = false, acquisition_timeout_ms = 5000 }
[step.expect]
reply = "IMAGE"
error = { status = false, code = 0 }
image = { width = 640, height = 480, ni_image_type = 0, custom_data_keys = ["buffer", "timestamp", "name", "type", "simulation", "flatfield"], custom_data = { type = "High-Mag", simulation = "FALSE", flatfield = "FALSE" } }

[[step]]
name = "stream LM (PNG simulation)"
command = "Cam Stream Next Image"
data = { camera_type = "Low Mag.", simulation = true, simulation_path = "${sim_dir}", simulation_timer_ms = 0 }
[step.expect]
reply = "IMAGE"
error = { status = false, code = 0 }
image = { width = "${first_png_width}", height = "${first_png_height}", ni_image_type = 0, custom_data_keys = [] }

[[step]]
command = "Cam Get Image"
data = { camera_type = "High Mag." }
expect = { reply = "none" }

[[step]]
command = "Cam Get Images Array"
expect = { reply = "none" }

[[step]]
command = "Cam Software Trigger"
data = { camera_type = "High Mag." }
expect = { reply = "ACK", error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 10 flat field
[[step]]
command = "Cam Set FlatField"
data = { camera_type = "High Mag.", enable = true, ffc_path = "${ffc}", dfc_path = "${dfc}", correction_factor = 1.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "stream HM (flat-field corrected)"
command = "Cam Stream Next Image"
data = { camera_type = "High Mag.", simulation = false, acquisition_timeout_ms = 5000 }
[step.expect]
reply = "IMAGE"
error = { status = false, code = 0 }
image = { width = 640, height = 480, ni_image_type = 0, custom_data = { type = "High-Mag", flatfield = "TRUE" } }

# ------------------------------------------------------------------------------------------ 11 LED
[[step]]
command = "Cam Set Led"
data = { camera_type = "High Mag.", led = true }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Cam Get Led"
data = { camera_type = "High Mag." }
expect = { reply = "BOOL", value = true, error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 12 focus (phase-1 stubs)
[[step]]
name = "autofocus stub (9507, always replied)"
command = "Cam Autofocus"
data = { camera_type = "High Mag.", autofocus_speed = "Slow", autofocus_method = "FFT", z_min = 5.0, z_max = 6.0, step = 0.1 }
expect = { reply = "ACK", error = { status = true, code = 9507, source_contains = "Cam Autofocus" } }

[[step]]
name = "refocus stub (9507, always replied)"
command = "Cam Refocus"
data = { camera_type = "High Mag.", steps = 5, step_mm = 0.01 }
expect = { reply = "ACK", error = { status = true, code = 9507, source_contains = "Cam Refocus" } }

[[step]]
command = "Cam Get Autofocus Data"
data = { camera_type = "High Mag." }
expect = { reply = "DBL2D", shape = [0, 0], error = { status = false, code = 0 } }

[[step]]
command = "Cam Get Autofocus Progress"
data = { camera_type = "High Mag." }
expect = { reply = "DBL", value = 0.0, error = { status = false, code = 0 } }

[[step]]
name = "internal command, never routed"
command = "Cam Autofocus Run"
data = { camera_type = "High Mag." }
expect = { reply = "none" }

[[step]]
name = "internal command, never routed"
command = "Cam Refocus Run"
data = { camera_type = "High Mag." }
expect = { reply = "none" }

# ------------------------------------------------------------------------------------------ 13-14 Z set-up and queries
[[step]]
name = "Z serial before set-up"
command = "Z Get Serial"
data = { type = false }
expect = { reply = "STR", value = "", error = { status = false, code = 0 } }

[[step]]
command = "Z Setup"
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "Z identity"
command = "Z Get Serial"
data = { type = true }
expect = { reply = "STR", value = "${stage_identity}", error = { status = false, code = 0 } }

[[step]]
command = "Z Get Status"
expect = { reply = "BOOL", value = true, error = { status = false, code = 0 } }

[[step]]
command = "Z Get Error"
expect = { reply = "STR", value = "", error = { status = false, code = 0 } }

[[step]]
name = "fast moves keep the test short"
command = "Z Set Speed"
data = { speed_mm_s = 50.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Get Speed"
expect = { reply = "DBL", value = 50.0, error = { status = false, code = 0 } }

[[step]]
command = "Z Get Reference"
expect = { reply = "BOOL", value = true, error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 15 moves and limits
[[step]]
command = "Z Move Absolute"
data = { pos_mm = 12.5 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Wait End Move"
data = { add_wait_ms = 0, polling_cycle_ms = 10, add_wait_only = false }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Get Position"
expect = { reply = "DBL", value = 12.5, abs_tol = 1e-6, error = { status = false, code = 0 } }

[[step]]
command = "Z Move Relative"
data = { move_mm = -2.5 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Wait End Move"
data = { add_wait_ms = 0, polling_cycle_ms = 10, add_wait_only = false }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Get Position"
expect = { reply = "DBL", value = 10.0, abs_tol = 1e-6 }

[[step]]
name = "out of range: 9405, error ACK suppressed"
command = "Z Move Absolute"
data = { pos_mm = 30.0 }
expect = { reply = "none" }

[[step]]
command = "Z Set Max Limit"
data = { value_mm = 24.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "inside the raised limit"
command = "Z Move Absolute"
data = { pos_mm = 22.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Wait End Move"
data = { add_wait_ms = 0, polling_cycle_ms = 10, add_wait_only = false }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Get Position"
expect = { reply = "DBL", value = 22.0, abs_tol = 1e-6 }

[[step]]
command = "Z Set Max Limit"
data = { value_mm = 20.0 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 16 joystick
[[step]]
command = "Z Enable Joystick"
data = { joystick_id = 1, joystick_axis = 1 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Joystick Enabled ?"
data = { joystick_id = 1, joystick_axis = 1 }
expect = { reply = "BOOL", value = true, error = { status = false, code = 0 } }

[[step]]
command = "Z Disable Joystick"
data = { joystick_id = 1, joystick_axis = 1 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Joystick Enabled ?"
data = { joystick_id = 1, joystick_axis = 1 }
expect = { reply = "BOOL", value = false, error = { status = false, code = 0 } }

# ------------------------------------------------------------------------------------------ 17-18 stop, reference, cleanup
[[step]]
command = "Z Stop"
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "error 10 left pending by STP (08 Z6)"
command = "Z Get Status"
expect = { reply = "BOOL", value = false, error = { status = true, code = 10, source = "Controller error" } }

[[step]]
command = "Z Do Reference"
data = { method = "FNL" }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
command = "Z Set Min Limit"
data = { value_mm = 0.5 }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "RMC? on the closed link fails: error ACK suppressed (08 Z9)"
command = "Z Cleanup"
expect = { reply = "none" }

# ------------------------------------------------------------------------------------------ 19-21 camera clean-up, unknown, Exit
[[step]]
name = "stop HM"
command = "Cam Stop"
data = { camera_type = "High Mag." }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "cleanup HM"
command = "Cam Cleanup"
data = { camera_type = "High Mag." }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "cleanup LM"
command = "Cam Cleanup"
data = { camera_type = "Low Mag." }
expect = { reply = "ACK", error = { status = false, code = 0 } }

[[step]]
name = "unknown command: no reply"
code = 32767
expect = { reply = "none" }

[[step]]
command = "Exit"
expect = { reply = "none", connection = "closed" }
